services:
  # 1. Go Orchestrator (houses the C++ discrete-event simulation engine)
  - type: web
    name: faultline-orchestrator
    runtime: docker
    dockerfilePath: orchestrator/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: KAFKA_BROKER
        value: localhost:9092
      - key: KAFKA_TOPIC
        value: faultline.experiments

  # 2. Python FastAPI Analytics Engine
  - type: web
    name: faultline-analytics
    runtime: docker
    dockerfilePath: analysis/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ORCHESTRATOR_URL
        fromService:
          type: web
          name: faultline-orchestrator
          property: host

  # 3. React + TypeScript Interactive Dashboard (Static Site)
  - type: web
    name: faultline-dashboard
    runtime: static
    buildCommand: cd dashboard && npm install && npm run build
    staticPublishPath: dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ORCHESTRATOR_URL
        fromService:
          type: web
          name: faultline-orchestrator
          property: host
      - key: VITE_ANALYTICS_URL
        fromService:
          type: web
          name: faultline-analytics
          property: host
