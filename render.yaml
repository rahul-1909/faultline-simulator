services:
  # Faultline: Unified Distributed Systems Failure Simulation Platform (All-in-One)
  - type: web
    name: faultline
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: STATIC_DIR
        value: /app/dashboard/dist
      - key: ANALYTICS_URL
        value: http://127.0.0.1:8000
      - key: KAFKA_BROKER
        value: localhost:9092
      - key: KAFKA_TOPIC
        value: faultline.experiments
